# Windows packaging for the native-windows-desktop change: the same
# `npm run build:win` a release runs, then the PE architecture check.
name: windows-spikes

on:
  push:
    paths-ignore:
      - scripts/probe-windows-desktop.*
      - .github/workflows/windows-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: |
          echo "image $env:ImageOS $env:ImageVersion"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install -g npm@12.2.0
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 20
      - run: node node_modules/electron/install.js
        timeout-minutes: 5
      - run: npm run build:win
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: bash
        run: node scripts/check-windows-pe-architecture.mjs release/*/win-unpacked
        timeout-minutes: 5
      - name: Probe the installer
        shell: pwsh
        timeout-minutes: 15
        run: |
          $installer = Get-ChildItem release/*/Terminay-Windows-*-Setup.exe | Select-Object -First 1
          ./scripts/probe-windows-desktop.ps1 -Installer $installer.FullName -Record "$env:RUNNER_TEMP/windows-probe.json"
      - if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/windows-probe.json" || true
          ls -la release/* || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-probe
          path: |
            ${{ runner.temp }}/windows-probe.json
            ${{ runner.temp }}/windows-probe-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.yml
            !release/**/win-unpacked/**
          retention-days: 7
