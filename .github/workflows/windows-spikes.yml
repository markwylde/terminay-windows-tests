# Windows packaging for the native-windows-desktop change. The spike jobs have
# recorded their evidence; only packaging runs now.
name: windows-spikes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: |
          echo "image $env:ImageOS $env:ImageVersion"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install -g npm@12.2.0
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 20
      - run: node node_modules/electron/install.js
        timeout-minutes: 5
      - run: npm run build:application-graph
        timeout-minutes: 15
      - run: npm run build:server-postcompile
        timeout-minutes: 15
      - run: npm run build:server-ui:bundle
        timeout-minutes: 10
      - run: npx tsc
        timeout-minutes: 10
      - run: npx vite build
        timeout-minutes: 10
      - run: npx vite build --config vite.server-preload.config.ts
        timeout-minutes: 5
      - shell: bash
        run: node scripts/build-ui-bundle-manifest.mjs dist "$(node -p "require('./package.json').version")" 1 remote.html
        timeout-minutes: 5
      - run: npx electron-builder --win nsis --x64 --publish never
        timeout-minutes: 15
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: always()
        shell: bash
        run: ls -laR release | head -50 || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.yml
          retention-days: 7
