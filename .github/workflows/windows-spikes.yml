# Windows packaging for the native-windows-desktop change: the same
# `npm run build:win` a release runs, then the PE architecture check.
name: windows-spikes

on:
  push:
    paths-ignore:
      - scripts/probe-windows-desktop.*
      - scripts/probe-windows-update.mjs
      - .github/workflows/windows-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: |
          echo "image $env:ImageOS $env:ImageVersion"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install -g npm@12.2.0
        timeout-minutes: 5
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 20
      - run: node node_modules/electron/install.js
        timeout-minutes: 5
      # A release always carries a version; 0.0.0 is a development build,
      # which never checks for updates.
      - run: node scripts/sync-package-version.mjs 1.0.0-beta.1
      # A release stages the WebRTC runtime from source, as here.
      - run: node scripts/stage-selected-secure-werift-runtime.mjs
        shell: bash
        timeout-minutes: 10
      # From Git Bash, as a release builds: its tar, not Windows', comes first.
      - run: npm run build:win
        shell: bash
        id: build
        timeout-minutes: 30
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: bash
        run: node scripts/check-windows-pe-architecture.mjs release/*/win-unpacked
        timeout-minutes: 5
      - name: Build the update probe's next version
        id: update_probe
        shell: bash
        timeout-minutes: 15
        run: |
          next="$(sh scripts/build-windows-update-probe.sh "$(node -p "require('./package.json').version")" "$RUNNER_TEMP/update-probe")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Probe the installer
        shell: pwsh
        timeout-minutes: 25
        env:
          UPDATE_VERSION: ${{ steps.update_probe.outputs.version }}
        run: |
          $installer = Get-ChildItem release/*/Terminay-Windows-*-Setup.exe | Select-Object -First 1
          ./scripts/probe-windows-desktop.ps1 -Installer $installer.FullName -Record "$env:RUNNER_TEMP/windows-probe.json" -UpdateFeed "$env:RUNNER_TEMP/update-probe" -UpdateVersion $env:UPDATE_VERSION
      - if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/windows-probe.json" || true
          ls -la release/* || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-probe
          path: |
            ${{ runner.temp }}/windows-probe.json
            ${{ runner.temp }}/windows-probe-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.update_probe.outcome == 'success'
        with:
          name: windows-update-feed
          path: |
            ${{ runner.temp }}/update-probe/*.exe
            ${{ runner.temp }}/update-probe/*.blockmap
            ${{ runner.temp }}/update-probe/beta.yml
          retention-days: 7
      # Kept whenever it built, so the probe-only workflow can rerun against it.
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: windows-installer
          path: |
            release/**/*.exe
            release/**/*.yml
            !release/**/win-unpacked/**
          retention-days: 7
